<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#121116">
    <title>Маршрут не найден — Город Нейросеть</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: #f3ead7; background: #121116; }
      main { width: min(680px, calc(100% - 40px)); padding: 3rem; border: 1px solid #45e6df; box-shadow: 12px 12px 0 rgba(155, 103, 255, .2); }
      p { color: #45e6df; font: 700 .75rem ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: .5rem 0 2rem; font-size: clamp(3rem, 12vw, 7rem); line-height: .9; text-transform: uppercase; }
      a { color: #121116; background: #45e6df; padding: .9rem 1.2rem; font-weight: 800; text-decoration: none; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <p>Ошибка 404</p>
      <h1>Маршрут<br>не найден</h1>
      <a href="/">Вернуться в город</a>
    </main>
  </body>
</html>
